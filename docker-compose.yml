services:
  adspy:
    build: .
    container_name: ad-spy-agent
    restart: unless-stopped
    environment:
      # Set in the server-side .env file (never commit the key).
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - HEADLESS=true
    volumes:
      # Persist research history + downloaded images across redeploys.
      - adspy_reports:/app/reports
    # Joins the shared "web" network so the host's single Caddy reverse proxy
    # (running in the intelligentspeech stack) can route to it by name: adspy:4000.
    # This app no longer ships its own Caddy and publishes no host ports — many
    # apps share one server behind one proxy. See SHARED-SERVER.md.
    networks:
      - web

networks:
  web:
    external: true

volumes:
  adspy_reports:
