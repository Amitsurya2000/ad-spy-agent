services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: adspy
      POSTGRES_USER: adspy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Only runs once, against an empty data directory (first boot). To
      # change the schema later, apply db/schema.sql by hand instead.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adspy -d adspy"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://adspy:${POSTGRES_PASSWORD}@postgres:5432/adspy
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      HEADLESS: "true"
    volumes:
      - ad_images:/data/ad-images
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./web
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://adspy:${POSTGRES_PASSWORD}@postgres:5432/adspy
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ad_images:/srv/ad-images:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  postgres_data:
  ad_images:
  caddy_data:
  caddy_config:
