name: Build desktop apps

on:
  push:
    paths:
      - 'desktop/**'
      - '.github/workflows/build-desktop.yml'
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r desktop/requirements.txt
      - run: pyinstaller --onefile --windowed --name AdSpyAgent desktop/app.py
      - uses: actions/upload-artifact@v4
        with:
          name: AdSpyAgent-Windows
          path: dist/AdSpyAgent.exe

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r desktop/requirements.txt
      - run: pyinstaller --onefile --windowed --name AdSpyAgent desktop/app.py
      - name: Package .app into a .dmg
        run: |
          cd dist
          hdiutil create -volname "Ad Spy Agent" -srcfolder AdSpyAgent.app -ov -format UDZO AdSpyAgent.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: AdSpyAgent-Mac
          path: dist/AdSpyAgent.dmg
